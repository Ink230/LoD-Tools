<div class="character-data-container">
  <div class="character-headline">
    <div class="character-head card-bg character-portrait-container">
      <img src="{{ 'assets/character/' + character.firstName.toLowerCase() + '.png' }}" class="character-portrait-img" />
    </div>
    <div class="character-head card-bg">
      <div>
        <b>{{ character.firstName }}</b>
      </div>
      <div>{{ character.species | species }}</div>
      <br />
      <div>{{ character.element | element }}</div>
      <br />
      <div>Hometown</div>
      <div>Acquired at Level {{ character.firstName }}</div>
      <div>Has {{ character.firstName }} Additions</div>
    </div>
    <div class="character-head card-bg">
      <div>
        <p>background</p>
        <p>battle general</p>
        <p>common strategies</p>
      </div>
    </div>
  </div>
  <div></div>
</div>

<div class="dropdown-container">
  <button #trigger type="button" class="selection" [class.selection-clicked]="open()" role="combobox"
    [attr.aria-label]="label()" [attr.aria-expanded]="open()" aria-haspopup="listbox"
    [attr.aria-controls]="id() + '-list'" [attr.aria-activedescendant]="open() ? id() + '-option-' + active() : null"
    (click)="toggle()" (keydown)="onKeydown($event)">
    <span class="selected-option">{{ selected() }}</span>
  </button>
  @if (open()) {
    <div class="menu-container">
      <div class="menu" role="listbox" [id]="id() + '-list'" [attr.aria-label]="label()">
        @for (option of options(); track option.value; let index = $index) {
          <button type="button" class="menu-option" role="option" tabindex="-1" [id]="id() + '-option-' + index"
            [attr.aria-selected]="value() === option.value" [class.highlight-option]="active() === index"
            (click)="choose(option.value)">{{ option.label }}</button>
        }
      </div>
    </div>
  }
</div>


<div class="dropdown-container">
  <div class="selection">
    <div class="selected-option" (click)="toggleDropdown()">{{ selected.name }}</div>
  </div>
  @if (this.displayDropdown) {
    <div class="dropdown-perimeter">
      <div class="dropdown">
      @for (item of dropdownOptions; track item.value) {
        <div class="dropdown-option" (click)="updateSelectedOption(item);closeDropdown()">{{ item.name }}</div>
      }
      </div>
    </div>
    @if (displayDropdownIdentifier) {
      <div class="dropdown-anti-container" id='{{ dropdownIdentifier }}' (click)="closeDropdown()"></div>
    }
    
  }
</div>

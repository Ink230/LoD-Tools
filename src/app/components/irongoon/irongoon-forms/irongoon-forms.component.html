@if (isVisible()) {
  @if (option().inputType === irongoonInput.Slider) {
    <app-irongoon-slider [option]="option()"></app-irongoon-slider>
  } @else if (option().inputType === irongoonInput.Dropdown) {
    <app-irongoon-dropdown [option]="option()"></app-irongoon-dropdown>
  } @else if (option().inputType === irongoonInput.Number) {
    <app-irongoon-number [option]="option()"></app-irongoon-number>
  }
}

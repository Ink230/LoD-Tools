<div class="irongoon">
  <div class="tabs">
    @for (tab of getNavigationTabs(); track tab.id) {
      <div class="tab" [ngClass]="{ tabSelected: isSelectedTab(tab.id) }" (click)="updateSelectedTab(tab.id)">
        <div>{{ tab.title }}</div>
      </div>
    }
  </div>

  <ng-container *ngComponentOutlet="displayTabComponent()"></ng-container>

  <div class="configOutputContainer">
    <div class="copyButton" (click)="copyConfigOutputToClipboard()">
      <img src="assets/copy-icon.svg" />
    </div>
    <div class="configOutput" #configOutputElement>
      sdsdsd <br />
      sfsdsd
    </div>
  </div>
</div>

<div class="irongoon">
  <div class="tabs">
    @for (tab of getNavigationTabs(); track tab.id) {
      <div class="tab" [ngClass]="{ tabSelected: isSelectedTab(tab.id) }" (click)="updateSelectedTab(tab.id)">
        <div>{{ tab.title }}</div>
      </div>
    }
  </div>

  <app-irongoon-category [selectedTab]="selectedTab()"></app-irongoon-category>

  <div class="macroOptions">
    <div class="macroOption">Generate Seed</div>
    <div class="macroOption" (click)="randomizeRandomizer()">Randomize</div>
    <div class="macroOption" (click)="resetRandomizer()">Reset</div>
  </div>

  <app-irongoon-config></app-irongoon-config>

  <app-irongoon-support></app-irongoon-support>
</div>

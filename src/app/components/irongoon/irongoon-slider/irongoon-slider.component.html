<div class="slider-parent">
  <div class="slider-container" (click)="onSliderClicked()">
    <input
      [id]="option().name"
      type="range"
      min="1"
      max="2"
      value="{{ option().value }}"
      [ngClass]="{ 'input-selected custom-thumb': option().value === 2, 'disabled disabled-thumb': option().disabled }"
      class="custom-thumb"
      [disabled]="option().disabled"
    />
  </div>
  <div class="option-text">
    <label [for]="option().name">{{ option().name }}</label>
  </div>
</div>

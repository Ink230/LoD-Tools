<div class="randomizer-container">
  @for (column of getCategory(); track column.id) {
    <div class="randomizer-column">
      @for (setting of column.settings; track setting.id) {
        <div class="option-category">
          <div class="option-category-title">{{ setting.name }}</div>
          @for (option of setting.options; track option.name) {
            <div class="option">
              <app-irongoon-forms [option]="option"></app-irongoon-forms>
            </div>
          }
        </div>
      }
    </div>
  }
</div>

version: 0.2
env:
  variables:
    APP_NAME: 'lodtools'
phases:
  install:
    runtime-versions:
      nodejs: 22.22.3
    commands:
      - npm config set legacy-peer-deps true
      - npm ci
  build:
    commands:
      - npm run build -- --configuration=production
  post_build:
    commands:
      - cd dist/$APP_NAME
      - find . -type f -exec gzip -9 {} \; -exec mv {}.gz {} \;
      - aws s3 sync . s3://${S3_BUCKET} --delete --content-encoding gzip --exclude "*.map" --cache-control max-age=31536000
      - |
        for notice in LICENSE.txt THIRD_PARTY_NOTICES.txt 3rdpartylicenses.txt browser/LICENSE.txt browser/THIRD_PARTY_NOTICES.txt browser/3rdpartylicenses.txt; do
          aws s3 cp "$notice" "s3://${S3_BUCKET}/$notice" --content-type "text/plain; charset=utf-8" --content-encoding gzip --cache-control no-cache || exit 1
        done
      - |
        for resource in browser/llms.txt browser/robots.txt browser/sitemap.xml browser/agent/*.json browser/agent/*.md browser/assets/game-data/*.json browser/assets/agent-routes.json browser/assets/mod-downloads.json; do
          case "$resource" in
            *.json) content_type='application/json; charset=utf-8' ;;
            *.md) content_type='text/markdown; charset=utf-8' ;;
            *.xml) content_type='application/xml; charset=utf-8' ;;
            *.txt) content_type='text/plain; charset=utf-8' ;;
          esac
          aws s3 cp "$resource" "s3://${S3_BUCKET}/$resource" --content-type "$content_type" --content-encoding gzip --cache-control no-cache || exit 1
        done

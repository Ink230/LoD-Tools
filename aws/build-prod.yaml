version: 0.2
env:
  variables:
    APP_NAME: 'lodtools'
phases:
  install:
    runtime-versions:
      nodejs: 22.2.0
    commands:
      - npm config set legacy-peer-deps true
      - npm ci
  build:
    commands:
      - npm run build -- --configuration=production
  post_build:
    commands:
      - cd dist/$APP_NAME
      - find . -type f -exec gzip -9 {} \; -exec mv {}.gz {} \;
      - aws s3 sync . s3://${S3_BUCKET} --delete --content-encoding gzip --exclude "*.map" --cache-control max-age=31536000
